<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e9ecef" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main content area -->
  <rect x="60" y="60" width="1080" height="510" fill="white" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Blueprint corner marks -->
  <text x="70" y="80" font-family="monospace" font-size="16" fill="#dee2e6">┌─</text>
  <text x="1100" y="80" font-family="monospace" font-size="16" fill="#dee2e6" text-anchor="end">─┐</text>
  <text x="70" y="560" font-family="monospace" font-size="16" fill="#dee2e6">└─</text>
  <text x="1100" y="560" font-family="monospace" font-size="16" fill="#dee2e6" text-anchor="end">─┘</text>
  
  <!-- Logo -->
  <rect x="100" y="120" width="80" height="80" rx="12" fill="#228be6"/>
  <text x="140" y="178" font-family="monospace" font-size="50" font-weight="bold" fill="white" text-anchor="middle">P</text>
  
  <!-- Title -->
  <text x="210" y="160" font-family="monospace" font-size="56" font-weight="bold" fill="#212529" letter-spacing="8">PRNT</text>
  <text x="210" y="190" font-family="monospace" font-size="14" fill="#228be6" letter-spacing="2">← TASK ARCHITECTURE SYSTEM</text>
  
  <!-- Feature boxes -->
  <g transform="translate(100, 260)">
    <!-- P0 -->
    <rect x="0" y="0" width="230" height="100" fill="white" stroke="#e03131" stroke-width="2"/>
    <text x="20" y="40" font-family="monospace" font-size="24" font-weight="bold" fill="#e03131">P0_QUADRANT</text>
    <text x="20" y="70" font-family="monospace" font-size="12" fill="#868e96">Urgent + Important</text>
    
    <!-- P1 -->
    <rect x="260" y="0" width="230" height="100" fill="white" stroke="#f59f00" stroke-width="2"/>
    <text x="280" y="40" font-family="monospace" font-size="24" font-weight="bold" fill="#f59f00">P1_QUADRANT</text>
    <text x="280" y="70" font-family="monospace" font-size="12" fill="#868e96">Important, Not Urgent</text>
    
    <!-- P2 -->
    <rect x="520" y="0" width="230" height="100" fill="white" stroke="#228be6" stroke-width="2"/>
    <text x="540" y="40" font-family="monospace" font-size="24" font-weight="bold" fill="#228be6">P2_QUADRANT</text>
    <text x="540" y="70" font-family="monospace" font-size="12" fill="#868e96">Urgent, Not Important</text>
    
    <!-- P3 -->
    <rect x="780" y="0" width="230" height="100" fill="white" stroke="#868e96" stroke-width="2"/>
    <text x="800" y="40" font-family="monospace" font-size="24" font-weight="bold" fill="#868e96">P3_QUADRANT</text>
    <text x="800" y="70" font-family="monospace" font-size="12" fill="#868e96">Neither</text>
  </g>
  
  <!-- Shorthand examples -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="1010" height="60" fill="rgba(34, 139, 230, 0.1)" stroke="#dee2e6" stroke-width="1"/>
    <text x="20" y="38" font-family="monospace" font-size="16" fill="#212529">> Review PR from AJ @today p0 #frontend /t</text>
    
    <g transform="translate(580, 15)">
      <rect x="0" y="0" width="60" height="30" fill="rgba(34, 139, 230, 0.2)" rx="2"/>
      <text x="30" y="22" font-family="monospace" font-size="14" fill="#228be6" text-anchor="middle">@today</text>
      
      <rect x="70" y="0" width="40" height="30" fill="rgba(224, 49, 49, 0.2)" rx="2"/>
      <text x="90" y="22" font-family="monospace" font-size="14" fill="#e03131" text-anchor="middle">p0</text>
      
      <rect x="120" y="0" width="80" height="30" fill="rgba(34, 139, 230, 0.2)" rx="2"/>
      <text x="160" y="22" font-family="monospace" font-size="14" fill="#228be6" text-anchor="middle">#frontend</text>
    </g>
  </g>
  
  <!-- Footer -->
  <text x="100" y="520" font-family="monospace" font-size="14" fill="#868e96">Eisenhower Matrix • Shorthand Commands • Google Calendar + Tasks Sync</text>
</svg>
